# Synapse + MAS + front reverse proxy, as on the production server (synapse_docker_setup_V2), with
# pinned versions and nothing but nginx published on the host. Copied to $PREFIX/matrix by install.sh,
# which also writes .env next to it. Do not run by hand on a fresh machine: use install.sh.
name: sbmatrix
services:
  synapse:
    image: ${SYNAPSE_IMAGE}
    container_name: synapse
    restart: unless-stopped
    volumes:
      # ./synapse on Linux; a Docker volume on Windows (sqlite on an NTFS share is slow and unsafe)
      - ${SYNAPSE_DATA:-./synapse}:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "curl", "-fSs", "http://localhost:8008/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  mas:
    image: ${MAS_IMAGE}
    container_name: mas
    restart: unless-stopped
    command: ["server"]
    environment:
      # Several files are merged (signing keys are kept apart in secrets.yaml)
      MAS_CONFIG: /config/config.yaml:/config/secrets.yaml
    volumes:
      - ./mas/config.yaml:/config/config.yaml:ro
      - ./mas/secrets.yaml:/config/secrets.yaml:ro
    depends_on:
      masdb:
        condition: service_healthy
    # "web": MAS reaches SwitchBoard's mail relay (sb_mail_relay) there, and install.sh/verify.sh
    # reach MAS's health and admin endpoints without going through nginx.
    networks: [internal, web]

  masdb:
    image: ${POSTGRES_IMAGE}
    container_name: masdb
    restart: unless-stopped
    environment:
      POSTGRES_USER: mas
      POSTGRES_PASSWORD: ${MAS_DB_PASSWORD}
      POSTGRES_DB: mas
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - ${POSTGRES_DATA:-./postgres}:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mas -d mas"]
      interval: 5s
      timeout: 5s
      retries: 30

  nginx:
    image: ${NGINX_IMAGE}
    container_name: synapse-nginx
    restart: unless-stopped
    # Reloads every 6 h so renewed certificates are picked up without a restart.
    command: ["/bin/sh", "-c", "while :; do sleep 6h; nginx -s reload; done & exec nginx -g 'daemon off;'"]
    ports:
      # Behind an upstream proxy (install.sh --behind-proxy) these are bound to 127.0.0.1 only and the
      # proxy reaches http://synapse-nginx:8080 on the "web" network instead.
      - "${BIND_ADDR:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDR:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./letsencrypt:/etc/letsencrypt:ro
      - ./certbot-www:/var/www/certbot:ro
    networks:
      internal: {}
      web:
        # Containers on "web" (the bridge, SwitchBoard) reach the public names through this proxy,
        # without leaving the machine (no hairpin NAT needed, and works with self-signed certificates).
        aliases: ["${MATRIX_HOST}", "${SB_HOST}", "${SBCHAT_HOST}", "${WP_HOST:-wordpress.invalid}"]

  certbot:
    image: ${CERTBOT_IMAGE}
    container_name: certbot
    restart: unless-stopped
    profiles: [letsencrypt]
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done"]
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./certbot-www:/var/www/certbot
    networks: [internal]

volumes:
  # used on Windows only (SYNAPSE_DATA=synapse-data, POSTGRES_DATA=postgres-data in .env)
  synapse-data:
    name: sbmatrix-synapse
  postgres-data:
    name: sbmatrix-postgres

networks:
  internal:
    driver: bridge
  web:
    name: web
    external: true
